name: verify-action

on:
  workflow_dispatch:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Use the released action from the standalone public repo
        id: valuation
        uses: Aymanseif/teos-repo-valuation@v1.2.4
        with:
          github-token: ${{ github.token }}

      - name: Assert the real consumer contract
        run: |
          echo "score=${{ steps.valuation.outputs.score }}"
          echo "decision=${{ steps.valuation.outputs.decision }}"
          test "${{ steps.valuation.outputs.score }}" = "90"
          test "${{ steps.valuation.outputs.decision }}" = "ALERT"
          test '${{ steps.valuation.outputs.valuation }}' = '$193-$442'